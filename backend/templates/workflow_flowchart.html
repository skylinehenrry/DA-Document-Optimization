<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      /* Theme tokens for the light, minimal flowchart style. */
      --bg: #f8fafd;
      --surface: #ffffff;
      --ink: #0c233c;
      --muted: #75829a;
      --border: #d7deea;
      --border-soft: #e6ebf2;
      --line: #f3f5f8;
      --line-hover: #98a2b3;
      --incoming: #e83e8c;
      --outgoing: #2f6bff;
      --python-chip: #eaf2ff;
      --python-accent: #2f6bff;
      --sql-chip: #f0ecff;
      --sql-accent: #7357d9;
      --alteryx-chip: #fff1e8;
      --alteryx-accent: #d66a2a;
      --bat-chip: #eef2f7;
      --bat-accent: #596579;
      --markdown-chip: #f3ecff;
      --markdown-accent: #8a4fe8;
      --json-chip: #fdecf5;
      --json-accent: #e83e8c;
      --csv-chip: #e8f7f4;
      --csv-accent: #0f8f7b;
      --excel-chip: #eaf7ef;
      --excel-accent: #2e8b57;
      --database-chip: #e7f6f8;
      --database-accent: #007a8a;
      --table-chip: #f0ecff;
      --table-accent: #7357d9;
      --html-chip: #fff0e8;
      --html-accent: #e85d2a;
      --log-chip: #f1f4f8;
      --log-accent: #718096;
      --file-chip: #f3f5f8;
      --file-accent: #8a94a6;
      --folder-chip: #fff7de;
      --folder-accent: #c98a00;
      --api-chip: #e8f2ff;
      --api-accent: #005eb8;
      --unknown-chip: #f3f5f8;
      --unknown-accent: #8a94a6;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,253,0.98)),
        var(--bg);
    }

    header {
      flex: 0 0 auto;
      padding: 20px 28px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.96);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .summary {
      margin-top: 7px;
      max-width: 980px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
    }

    .zoom-controls {
      /* Fixed controls for scaling the canvas without changing the graph data. */
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(16,24,40,0.04);
    }

    .zoom-button {
      min-width: 34px;
      padding: 0 8px;
      white-space: nowrap;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #005eb8;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .zoom-button:hover {
      background: #e8f2ff;
    }

    .zoom-value {
      min-width: 48px;
      color: #475467;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .view-controls {
      /*
        - These controls filter presentation only; the reviewed graph stays intact.
        - Keep labels visible so the direct view and full detail view are distinct.
        - Wrap controls on narrower screens and when Windows scales the display.
      */
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-top: 15px;
      font: 12px/1.5 system-ui, sans-serif;
      color: #475569;
    }

    .view-controls label { display: flex; align-items: center; gap: 7px; }
    .view-controls select {
      max-width: min(360px, 65vw);
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
      color: var(--ink);
      background: white;
    }
    .view-controls button { font: inherit; }
    .view-controls select:focus-visible,
    .view-controls button:focus-visible { outline: 2px solid #275dad; outline-offset: 2px; }
    @media (max-width: 680px) {
      header { padding: 15px; }
      .header-top { flex-wrap: wrap; gap: 12px; }
      h1 { font-size: 21px; overflow-wrap: anywhere; }
    }

    main {
      /* Main owns scrolling, so large charts can exceed the browser viewport. */
      flex: 1 1 auto;
      min-height: 0;
      padding: 18px 22px 22px;
      overflow: auto;
      scrollbar-gutter: stable both-edges;
      overscroll-behavior: contain;
    }

    main::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }

    main::-webkit-scrollbar-track {
      background: #eef2f7;
      border-radius: 999px;
    }

    main::-webkit-scrollbar-thumb {
      border: 3px solid #eef2f7;
      border-radius: 999px;
      background: #b9c5d6;
    }

    main::-webkit-scrollbar-thumb:hover {
      background: #8a94a6;
    }

    .canvas-sizer {
      /* This wrapper grows / shrinks when zoom changes. */
      position: relative;
      width: {{ canvas_width }}px;
      height: {{ canvas_height }}px;
    }

    .canvas {
      /* The actual drawing surface. Python fills in the pixel size. */
      position: relative;
      width: {{ canvas_width }}px;
      height: {{ canvas_height }}px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(16,24,40,0.06);
      transform-origin: top left;
    }

    svg.edges {
      /* SVG lines are drawn under the HTML cards. */
      position: absolute;
      inset: 0;
      width: {{ canvas_width }}px;
      height: {{ canvas_height }}px;
      z-index: 1;
      pointer-events: auto;
      overflow: visible;
    }

    .node {
      /* Every script / resource card uses the same fixed size for alignment. */
      position: absolute;
      z-index: 3;
      width: 300px;
      height: 82px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(16,24,40,0.06);
    }

    .script-node {
      cursor: pointer;
      transition:
        transform 140ms ease,
        box-shadow 140ms ease,
        border-color 140ms ease;
    }

    .script-node:hover {
      transform: translateY(-2px);
      border-color: #b8c7d9;
      box-shadow: 0 16px 34px rgba(16,24,40,0.10);
    }

    .icon {
      /* Pastel chip behind each reusable SVG icon. */
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--unknown-chip);
      color: var(--unknown-accent);
      line-height: 1;
    }

    .icon svg {
      /* Icons use currentColor, so each file type can set its own accent. */
      width: 31px;
      height: 31px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-text {
      fill: currentColor;
      stroke: none;
      font: 800 8px "Cambria Math", Cambria, Georgia, serif;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    .type-alteryx .icon .icon-text,
    .type-json .icon .icon-text,
    .type-html .icon .icon-text {
      font-size: 9px;
    }

    .type-python .icon { background: var(--python-chip); color: var(--python-accent); }
    .type-sql .icon { background: var(--sql-chip); color: var(--sql-accent); }
    .type-alteryx .icon { background: var(--alteryx-chip); color: var(--alteryx-accent); font-size: 27px; }
    .type-bat .icon { background: var(--bat-chip); color: var(--bat-accent); font-size: 16px; }
    .type-markdown .icon { background: var(--markdown-chip); color: var(--markdown-accent); font-size: 19px; }
    .type-json .icon { background: var(--json-chip); color: var(--json-accent); font-size: 22px; }
    .type-csv .icon { background: var(--csv-chip); color: var(--csv-accent); font-size: 21px; }
    .type-excel .icon { background: var(--excel-chip); color: var(--excel-accent); font-size: 22px; }
    .type-database .icon { background: var(--database-chip); color: var(--database-accent); }
    .type-table .icon { background: var(--table-chip); color: var(--table-accent); }
    .type-html .icon { background: var(--html-chip); color: var(--html-accent); font-size: 15px; }
    .type-log .icon { background: var(--log-chip); color: var(--log-accent); font-size: 12px; }
    .type-file .icon { background: var(--file-chip); color: var(--file-accent); font-size: 11px; }
    .type-folder .icon { background: var(--folder-chip); color: var(--folder-accent); }
    .type-api .icon { background: var(--api-chip); color: var(--api-accent); }

    .node-kind {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .node-label {
      /* Card label shows a short filename; the full path remains in title=. */
      margin-top: 3px;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.18;
      font-weight: 760;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .node-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }

    .stage-id {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 7px;
      background: #eef2f7;
      color: #0c233c;
      font-size: 11px;
      font-weight: 700;
    }

    .edge-path {
      /* Visible connector line. The transparent hit path below handles hover. */
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8;
      marker-end: url(#arrow);
      pointer-events: none;
    }

    .edge-low {
      stroke-dasharray: 6 5;
    }

    .edge-hit {
      /* Larger invisible target so thin lines are easy to hover. */
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      pointer-events: stroke;
    }

    .edge-tooltip-text {
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
    }

    .anchor {
      pointer-events: none;
      fill: #ffffff;
      stroke: #d7deea;
      stroke-width: 1.4;
    }

    .edge:hover .edge-tooltip-text {
      opacity: 1;
    }

    .edge:hover .edge-path {
      stroke: var(--line-hover);
      stroke-width: 2.8;
      marker-end: url(#arrowHover);
    }

    .edge.is-active .edge-path {
      /* JavaScript adds this class after moving the hovered edge to the top. */
      stroke: var(--line-hover);
      stroke-width: 2.8;
      marker-end: url(#arrowHover);
    }

    .edge-tooltip-text {
      font: 14px "Cambria Math", Cambria, Georgia, serif;
      font-weight: 800;
      fill: #596579;
    }

    .summary-preview {
      position: fixed;
      z-index: 40;
      width: min(360px, calc(100vw - 40px));
      padding: 16px 17px;
      border: 1px solid rgba(208,215,226,0.86);
      border-radius: 14px;
      background: rgba(255,255,255,0.84);
      box-shadow: 0 18px 46px rgba(0,51,141,0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(6px) scale(0.98);
      transition:
        opacity 120ms ease,
        transform 120ms ease;
      pointer-events: none;
    }

    .summary-preview.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .summary-preview-title {
      margin-bottom: 7px;
      color: #0c233c;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }

    .summary-preview-body {
      color: #475467;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(15,23,42,0.26);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .modal-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .script-modal {
      width: min(760px, 100%);
      max-height: min(680px, calc(100vh - 64px));
      overflow: auto;
      border: 1px solid rgba(208,215,226,0.86);
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 26px 70px rgba(0,51,141,0.28);
      transform: translateY(10px) scale(0.98);
      transition: transform 160ms ease;
    }

    .modal-backdrop.is-visible .script-modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 14px;
      border-bottom: 1px solid rgba(208,215,226,0.72);
    }

    .modal-title {
      margin: 0;
      color: #0c233c;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }

    .modal-meta {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .modal-pill {
      padding: 5px 8px;
      border-radius: 999px;
      background: #e8f2fc;
      color: #475467;
      font-size: 11px;
      font-weight: 800;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: #e8f2fc;
      color: #475467;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #dbeaf8;
      color: #0c233c;
    }

    .modal-body {
      padding: 22px 24px 26px;
    }

    .modal-section-label {
      margin: 0 0 8px;
      color: #667085;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .modal-summary {
      margin: 0;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.65;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1>{{ title }}</h1>
        <div class="summary">{{ summary }}</div>
      </div>
      <div class="zoom-controls" aria-label="Flowchart zoom controls">
        <button id="zoomOut" class="zoom-button" type="button" aria-label="Zoom out">-</button>
        <span id="zoomValue" class="zoom-value">100%</span>
        <button id="zoomIn" class="zoom-button" type="button" aria-label="Zoom in">+</button>
        <button id="zoomReset" class="zoom-button" type="button">Reset</button>
        <button id="zoomFit" class="zoom-button" type="button">Fit view</button>
      </div>
    </div>
    <div class="view-controls" aria-label="Connection view controls">
      <label for="connectionView">Connections
        <select id="connectionView">
          <option value="direct">Direct connections</option>
          <option value="all">All relationships</option>
        </select>
      </label>
      <label for="focusNode">Focus
        <select id="focusNode"><option value="">All nodes</option></select>
      </label>
      <button id="clearFocus" class="zoom-button" type="button">Clear focus</button>
      <span id="focusStatus" role="status" aria-live="polite">Showing all nodes</span>
    </div>
  </header>
  <main>
    <div id="canvasSizer" class="canvas-sizer">
    <section id="flowchartCanvas" class="canvas" aria-label="Workflow flowchart" data-canvas-width="{{ canvas_width }}" data-canvas-height="{{ canvas_height }}">
      <svg class="edges" viewBox="0 0 {{ canvas_width }} {{ canvas_height }}" aria-hidden="true">
        <defs>
          <!-- Normal and hover markers are separate because SVG marker fill
               does not automatically inherit the hovered line's stroke color. -->
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#f3f5f8"></path>
          </marker>
          <marker id="arrowHover" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#98a2b3"></path>
          </marker>
        </defs>
{{ edge_svg }}
      </svg>
{{ node_html }}
    </section>
    </div>
  </main>
  <div id="summaryPreview" class="summary-preview" aria-hidden="true">
    <div id="summaryPreviewTitle" class="summary-preview-title"></div>
    <div id="summaryPreviewBody" class="summary-preview-body"></div>
  </div>
  <div id="scriptModalBackdrop" class="modal-backdrop" aria-hidden="true">
    <section class="script-modal" role="dialog" aria-modal="true" aria-labelledby="scriptModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="scriptModalTitle" class="modal-title"></h2>
          <div class="modal-meta">
            <span id="scriptModalType" class="modal-pill"></span>
            <span id="scriptModalStage" class="modal-pill"></span>
          </div>
        </div>
        <button id="scriptModalClose" class="modal-close" type="button" aria-label="Close">x</button>
      </div>
      <div class="modal-body">
        <p class="modal-section-label">Detailed Summary</p>
        <p id="scriptModalBody" class="modal-summary"></p>
      </div>
    </section>
  </div>
  <script>
    /*
      Browser behavior for the generated flowchart.
      - Zoom controls scale the canvas after Python has positioned the nodes
      - Script cards show a small summary on hover
      - Script cards open a detail modal on click
      - Edge hover labels appear only when the user points at an edge
      - Hovered edges are moved to the top of the SVG so they are not hidden
      - Card hover highlights every edge connected to that card
      - Direct view groups repeated references without changing stored edges
      - Focus shows only one node and its immediate incoming/outgoing neighbors
    */
    const allNodes = document.querySelectorAll(".node");
    const scriptNodes = document.querySelectorAll(".script-node");
    const preview = document.getElementById("summaryPreview");
    const previewTitle = document.getElementById("summaryPreviewTitle");
    const previewBody = document.getElementById("summaryPreviewBody");
    const modalBackdrop = document.getElementById("scriptModalBackdrop");
    const modalTitle = document.getElementById("scriptModalTitle");
    const modalType = document.getElementById("scriptModalType");
    const modalStage = document.getElementById("scriptModalStage");
    const modalBody = document.getElementById("scriptModalBody");
    const modalClose = document.getElementById("scriptModalClose");
    const canvasSizer = document.getElementById("canvasSizer");
    const flowchartCanvas = document.getElementById("flowchartCanvas");
    const zoomValue = document.getElementById("zoomValue");
    const zoomOut = document.getElementById("zoomOut");
    const zoomIn = document.getElementById("zoomIn");
    const zoomReset = document.getElementById("zoomReset");
    const zoomFit = document.getElementById("zoomFit");
    const viewport = document.querySelector("main");
    const edgeGroups = document.querySelectorAll(".edge");
    const connectionView = document.getElementById("connectionView");
    const focusNode = document.getElementById("focusNode");
    const clearFocus = document.getElementById("clearFocus");
    const focusStatus = document.getElementById("focusStatus");
    const canvasWidth = Number(flowchartCanvas.dataset.canvasWidth);
    const canvasHeight = Number(flowchartCanvas.dataset.canvasHeight);
    let zoom = 1;

    function updateConnectionView() {
      /*
        - Switch between grouped connections and the original relationship records.
        - Follow only edges touching the selected node; never walk another hop.
        - Keep node coordinates, edge evidence, and embedded graph data unchanged.
      */
      flowchartCanvas.classList.toggle("show-all-relationships", connectionView.value === "all");
      const selected = focusNode.value;
      const visible = new Set(selected ? [selected] : []);
      let directCount = 0;
      edgeGroups.forEach((edge) => {
        const touchesSelection = !selected || edge.dataset.source === selected || edge.dataset.target === selected;
        edge.classList.toggle("outside-focus", !touchesSelection);
        if (touchesSelection) {
          visible.add(edge.dataset.source);
          visible.add(edge.dataset.target);
          if (connectionView.value === "all" || !edge.classList.contains("connection-member")) directCount += 1;
        }
      });
      allNodes.forEach((node) => {
        node.classList.toggle("outside-focus", Boolean(selected) && !visible.has(node.dataset.nodeId));
      });
      focusStatus.textContent = selected
        ? `${visible.size} nodes · ${directCount} direct ${connectionView.value === "all" ? "relationships" : "connections"}`
        : `Showing all ${allNodes.length} nodes · ${directCount} ${connectionView.value === "all" ? "relationships" : "direct connections"}`;
      clearFocus.disabled = !selected;
      hidePreview();
      fitVisibleNodes();
    }

    function fitVisibleNodes() {
      /*
        - Changing focus must bring its nodes into view, not leave a blank canvas.
        - Fit the visible cards with padding for arrows; keep their saved positions.
        - With no focus use the full drawing bounds, including long routed edges.
        - Scale and scroll only the viewport; never rewrite graph coordinates.
      */
      let left = 0, top = 0, right = canvasWidth, bottom = canvasHeight;
      if (focusNode.value) {
        const cards = [...allNodes].filter(node => !node.classList.contains("outside-focus"));
        if (!cards.length) return;
        left = Math.max(0, Math.min(...cards.map(node => Number(node.dataset.x))) - 80);
        top = Math.max(0, Math.min(...cards.map(node => Number(node.dataset.y))) - 80);
        right = Math.max(...cards.map(node => Number(node.dataset.x) + node.offsetWidth)) + 100;
        bottom = Math.max(...cards.map(node => Number(node.dataset.y) + node.offsetHeight)) + 100;
        // - A connector may detour around cards hidden by the focus filter.
        // - Include its complete route so the visible connection is not clipped.
        edgeGroups.forEach(edge => {
          if (edge.classList.contains("outside-focus")) return;
          if (connectionView.value !== "all" && edge.classList.contains("connection-member")) return;
          const bounds = edge.getBBox();
          left = Math.min(left, Math.max(0, bounds.x - 30));
          top = Math.min(top, Math.max(0, bounds.y - 30));
          right = Math.max(right, bounds.x + bounds.width + 30);
          bottom = Math.max(bottom, bounds.y + bounds.height + 30);
        });
      }
      const availableWidth = Math.max(240, viewport.clientWidth - 70);
      const availableHeight = Math.max(140, viewport.clientHeight - 50);
      setZoom(Math.min(1, availableWidth / Math.max(1, right - left), availableHeight / Math.max(1, bottom - top)));
      viewport.scrollLeft = Math.max(0, left * zoom);
      viewport.scrollTop = Math.max(0, top * zoom);
    }

    /*
      - Filenames stay short on cards; duplicate names retain full paths here.
      - Use textContent rather than HTML so source labels remain inert text.
      - Options carry stable node IDs, never ambiguous filenames.
    */
    const labelCounts = new Map();
    allNodes.forEach((node) => {
      const label = node.querySelector(".node-label").textContent;
      labelCounts.set(label, (labelCounts.get(label) || 0) + 1);
    });
    allNodes.forEach((node) => {
      const label = node.querySelector(".node-label").textContent;
      const option = document.createElement("option");
      option.value = node.dataset.nodeId;
      option.textContent = labelCounts.get(label) > 1 ? `${label} (${node.dataset.sourcePath || node.dataset.nodeId})` : label;
      option.title = node.title;
      focusNode.appendChild(option);
    });
    connectionView.addEventListener("change", updateConnectionView);
    focusNode.addEventListener("change", updateConnectionView);
    clearFocus.addEventListener("click", () => { focusNode.value = ""; updateConnectionView(); });

    function setZoom(nextZoom) {
      /*
        Tool for changing flowchart scale.
        - Clamp zoom to a readable range
        - Scale the canvas using CSS transform
        - Resize the wrapper so browser scrollbars match the scaled size
      */
      zoom = Math.min(1.6, Math.max(0.1, nextZoom));
      flowchartCanvas.style.transform = `scale(${zoom})`;
      canvasSizer.style.width = `${canvasWidth * zoom}px`;
      canvasSizer.style.height = `${canvasHeight * zoom}px`;
      zoomValue.textContent = `${Math.round(zoom * 100)}%`;
    }

    function placePreview(event) {
      /*
        Tool for positioning the hover summary.
        - Start near the mouse pointer
        - Flip left / upward when near the browser edge
        - Keep the preview inside the visible viewport
      */
      const margin = 18;
      const previewWidth = preview.offsetWidth || 360;
      const previewHeight = preview.offsetHeight || 160;
      let left = event.clientX + margin;
      let top = event.clientY + margin;

      if (left + previewWidth > window.innerWidth - margin) {
        left = event.clientX - previewWidth - margin;
      }

      if (top + previewHeight > window.innerHeight - margin) {
        top = event.clientY - previewHeight - margin;
      }

      preview.style.left = `${Math.max(margin, left)}px`;
      preview.style.top = `${Math.max(margin, top)}px`;
    }

    function showPreview(event) {
      /*
        Tool for displaying high-level script summary.
        - Reads summary text from the script card's data attributes
        - Positions the floating preview near the cursor
      */
      const highLevelSummary = event.currentTarget.dataset.highLevelSummary;
      if (!highLevelSummary) return;

      previewTitle.textContent = event.currentTarget.dataset.scriptName || "Script Summary";
      previewBody.textContent = highLevelSummary;
      placePreview(event);
      preview.classList.add("is-visible");
      preview.setAttribute("aria-hidden", "false");
    }

    function hidePreview() {
      /* Hide the floating hover summary when the mouse leaves a script card. */
      preview.classList.remove("is-visible");
      preview.setAttribute("aria-hidden", "true");
    }

    function openModal(node) {
      /*
        Tool for showing detailed script summary.
        - Reads detailed summary from the clicked card
        - Updates modal title / metadata / body
        - Makes the modal visible on top of the chart
      */
      modalTitle.textContent = node.dataset.scriptName || "Script Summary";
      modalType.textContent = node.dataset.scriptType || "Script";
      modalStage.textContent = node.dataset.stageOrderId || "No Stage ID";
      modalBody.textContent = node.dataset.detailedSummary || "No detailed summary available.";
      modalBackdrop.classList.add("is-visible");
      modalBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      /* Hide the detailed script summary modal. */
      modalBackdrop.classList.remove("is-visible");
      modalBackdrop.setAttribute("aria-hidden", "true");
    }

    function setConnectedEdgesActive(node, isActive) {
      /*
        Tool for tracing card relationships.
        - Reads the hovered card's node ID
        - Finds every edge where this node is source or target
        - Adds the active style so connected lines and arrow tips stand out
        - Moves active edges to the top of the SVG drawing order
      */
      const nodeId = node.dataset.nodeId;
      if (!nodeId) return;

      edgeGroups.forEach((edge) => {
        const isConnected = edge.dataset.source === nodeId || edge.dataset.target === nodeId;
        if (!isConnected) return;

        edge.classList.toggle("is-active", isActive);

        if (isActive) {
          edge.parentElement.appendChild(edge);
        }
      });
    }

    // Bind all card interactions.
    // Hovering any script or data card highlights every connected edge.
    allNodes.forEach((node) => {
      node.addEventListener("mouseenter", () => setConnectedEdgesActive(node, true));
      node.addEventListener("mouseleave", () => setConnectedEdgesActive(node, false));
    });

    // Bind script card interactions.
    // Hover = quick summary; click = detailed summary.
    scriptNodes.forEach((node) => {
      node.addEventListener("mouseenter", showPreview);
      node.addEventListener("mousemove", placePreview);
      node.addEventListener("mouseleave", hidePreview);
      node.addEventListener("click", () => {
        hidePreview();
        openModal(node);
      });
    });

    // Bind edge interactions.
    // SVG renders later elements on top, so appendChild(edge) brings the
    // hovered connector above neighboring connector lines.
    edgeGroups.forEach((edge) => {
      edge.addEventListener("mouseenter", () => {
        edge.parentElement.appendChild(edge);
        edge.classList.add("is-active");
      });
      edge.addEventListener("mouseleave", () => {
        edge.classList.remove("is-active");
      });
    });

    // Close the modal through button, backdrop click, or Escape key.
    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    // Wire up zoom controls after all elements are available.
    zoomOut.addEventListener("click", () => setZoom(zoom - 0.1));
    zoomIn.addEventListener("click", () => setZoom(zoom + 0.1));
    zoomReset.addEventListener("click", () => setZoom(1));
    zoomFit.addEventListener("click", fitVisibleNodes);
    setZoom(1);
    updateConnectionView();
  </script>
</body>
</html>
