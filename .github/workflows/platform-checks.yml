name: Offline platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8:backslashreplace'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check backend, recovery, platform and editor contracts
        env:
          DA_WORKFLOW_STORE: ${{ runner.temp }}/da-workflow-ci/store
        run: python -B -m unittest discover -s tests -q
      - name: Check frontend state and request recovery
        working-directory: frontend
        run: node --test
